server:
  port: 8080

spring:
  # 默认 dev（本地开发），生产通过环境变量 SPRING_PROFILES_ACTIVE 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ruikao-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      # 生产环境若开启 Redis 认证，用环境变量注入密码（默认不认证，空值不生效）
      password: ${REDIS_PASSWORD:}
      connect-timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  type-aliases-package: com.ruikao.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: AUTO

ruikao:
  jwt:
    # 生产环境务必用环境变量注入独立密钥，默认值仅用于本地开发
    admin-secret-key: ${RUIKAO_JWT_ADMIN_SECRET:ruikao-admin-secret-key-2026-ruikao-admin-32}
    admin-ttl: 7200000
    admin-token-name: Authorization
    student-secret-key: ${RUIKAO_JWT_STUDENT_SECRET:ruikao-student-secret-key-2026-ruikao-stu}
    student-ttl: 7200000
    student-token-name: Authorization
  upload:
    base-path: ./uploads
  alioss:
    # 生产用环境变量注入（RUIKAO_ALIOSS_*）；dev profile 由 application-dev.yml 提供真实值
    endpoint: ${RUIKAO_ALIOSS_ENDPOINT:}
    access-key-id: ${RUIKAO_ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${RUIKAO_ALIOSS_ACCESS_KEY_SECRET:}
    bucket-name: ${RUIKAO_ALIOSS_BUCKET_NAME:}
  wechat:
    # 微信小程序配置，生产用环境变量注入；dev profile 由 application-dev.yml 提供真实值
    appid: ${RUIKAO_WECHAT_APPID:}
    secret: ${RUIKAO_WECHAT_SECRET:}
  cors:
    # 允许跨域的来源（逗号分隔），生产按部署域名修改
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

logging:
  level:
    com.ruikao: INFO
    com.ruikao.server.mapper: WARN
