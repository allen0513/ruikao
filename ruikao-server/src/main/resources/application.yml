server:
  port: 8080

spring:
  profiles:
    active: dev
  application:
    name: ruikao-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      connect-timeout: 3000
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

mybatis-plus:
  type-aliases-package: com.ruikao.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: AUTO

ruikao:
  jwt:
    admin-secret-key: ruikao-admin-secret-key-2026-ruikao-admin-32
    admin-ttl: 7200000
    admin-token-name: Authorization
    student-secret-key: ruikao-student-secret-key-2026-ruikao-stu
    student-ttl: 7200000
    student-token-name: Authorization
  upload:
    base-path: ./uploads
  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}

logging:
  level:
    com.ruikao: INFO
    com.ruikao.server.mapper: WARN
