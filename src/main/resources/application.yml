server:
  port: 8080

spring:
  # 默认 dev（本地开发），生产通过环境变量 SPRING_PROFILES_ACTIVE 覆盖
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ruikao-server
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  data:
    redis:
      # 生产用环境变量注入（RUIKAO_REDIS_*）；dev profile 由 application-dev.yml 提供真实值
      host: ${RUIKAO_REDIS_HOST:}
      port: ${RUIKAO_REDIS_PORT:6379}
      password: ${RUIKAO_REDIS_PASSWORD:}
      database: ${RUIKAO_REDIS_DATABASE:}
      connect-timeout: 3000
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s

mybatis-plus:
  type-aliases-package: com.ruikao.pojo.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: AUTO

ruikao:
  jwt:
    # 生产环境务必用环境变量注入独立密钥，默认值仅用于本地开发
    admin-secret-key: ${RUIKAO_JWT_ADMIN_SECRET:ruikao-admin-secret-key-2026-ruikao-admin-32}
    admin-ttl: 7200000
    admin-token-name: Authorization
    student-secret-key: ${RUIKAO_JWT_STUDENT_SECRET:ruikao-student-secret-key-2026-ruikao-stu}
    student-ttl: 7200000
    student-token-name: Authorization
  upload:
    base-path: ./uploads
  alioss:
    # 生产用环境变量注入（RUIKAO_ALIOSS_*）；dev profile 由 application-dev.yml 提供真实值
    endpoint: ${RUIKAO_ALIOSS_ENDPOINT:}
    access-key-id: ${RUIKAO_ALIOSS_ACCESS_KEY_ID:}
    access-key-secret: ${RUIKAO_ALIOSS_ACCESS_KEY_SECRET:}
    bucket-name: ${RUIKAO_ALIOSS_BUCKET_NAME:}
  cors:
    # 允许跨域的来源（逗号分隔），默认 * 便于局域网/多端调试；生产用 RUIKAO_CORS_ALLOWED_ORIGINS 收紧为具体域名
    allowed-origins: ${RUIKAO_CORS_ALLOWED_ORIGINS:*}

logging:
  level:
    com.ruikao: INFO
    com.ruikao.server.mapper: WARN
